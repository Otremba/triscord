name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  backend-workers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [cloudflare, cloudflare-auth]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test
