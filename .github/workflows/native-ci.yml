name: Native Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build web assets
        working-directory: desktop/web
        run: |
          npm ci
          npm run typecheck
          node tools/build.mjs --tauri
      - name: Run Rust tests
        working-directory: desktop-rust/src-tauri
        run: cargo test
      - name: Build release executable
        working-directory: desktop-rust/src-tauri
        run: cargo build --release
