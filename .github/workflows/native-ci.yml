name: Native Windows build

# Builds are explicit; this workflow does not open clients, make calls or execute E2E harnesses.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtwebsockets qtmultimedia
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare build tools and WebView2 SDK
        shell: pwsh
        run: |
          python -m pip install cmake==4.4.4 ninja==1.13.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./desktop/scripts/setup-webview2.ps1
      - name: Prepare interface
        working-directory: desktop/web
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Compile current native client
        shell: pwsh
        run: |
          cmake -S desktop -B desktop/out/ci-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DTRISCORD_BUILD_DEV_TOOLS=OFF -DTRISCORD_BUILD_WEB_CLIENT=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build desktop/out/ci-build --target triscord-web-assets --parallel 4
