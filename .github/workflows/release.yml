name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # electron-builder only warns when an extraResources file is missing, so
      # without this step the installer silently ships without system audio
      - name: Build native audio helper
        run: npm run build:native

      - name: Check native audio helper
        shell: pwsh
        run: |
          if (-not (Test-Path native/bin/loopback-capture.exe)) {
            throw 'native/bin/loopback-capture.exe was not built'
          }

      - name: Build and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
