name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # electron-builder only warns when an extraResources file is missing, so
      # without this step the installer silently ships without system audio
      - name: Build native audio helper
        run: npm run build:native

      - name: Check native audio helper
        shell: pwsh
        run: |
          if (-not (Test-Path native/bin/loopback-capture.exe)) {
            throw 'native/bin/loopback-capture.exe was not built'
          }

      # electron-builder uploads each file in parallel, and when publishing
      # straight to a release (not a draft) every upload can create its own
      # release for the same tag. v1.1.3 ended up split in two, with the tag's
      # download links pointing at the one without latest.yml, which broke
      # auto-update. So build here and publish all files in a single call.
      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $files = @(
            "release/Triscord-Setup-$version.exe",
            "release/Triscord-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "$file was not built" }
          }
          gh release create $tag @files --title $tag --generate-notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
